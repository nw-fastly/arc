name: Publish Pulse evidence
on:
  workflow_run:
    workflows: [Pulse reports]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  publish:
    uses: pulse-compute/report-action/.github/workflows/publish.yml@1859f9d749d9702fb0597e2b1eedda9b9bcedb57
    with:
      policy_path: .github/pulse-report-publisher.json
      # Enable only after the default-branch dry-run admission is reviewed.
      dry_run: false
