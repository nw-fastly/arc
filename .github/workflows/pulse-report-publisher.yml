name: Publish Pulse evidence
on:
  workflow_run:
    workflows: [Pulse reports]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  publish:
    uses: pulse-compute/report-action/.github/workflows/publish.yml@0408c9c4393f9ba889c5f371ea803105535d31a5
    with:
      policy_path: .github/pulse-report-publisher.json
      # Enable only after the default-branch dry-run admission is reviewed.
      dry_run: false
